name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go run ./tools/repoctl doctor
      - run: go run ./tools/repoctl check
      - name: Repeat process cancellation on macOS
        if: runner.os == 'macOS'
        run: go test ./internal/app -run '^TestDestroyCancelsActualCommandTreeBeforeSourceCleanup$' -count=50 -timeout=5m
      - run: go build ./cmd/agent-env
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go test -race ./...
      - run: go run ./tools/repoctl test-integration
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {os: windows, arch: amd64}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go build ./cmd/agent-env
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
