name: Browser native
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        id: chrome
        with:
          chrome-version: '152.0.7977.82'
          install-dependencies: true
          install-chromedriver: false
      - name: Run real lease-owned Browser/CDP integration
        run: go test -tags=browserintegration ./internal/cli -run '^TestBrowserNativeCLI$' -count=1 -v -timeout=12m
        env:
          AGENT_ENV_BROWSER_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
