name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  AGENT_ENV_RELEASE_TAG: ${{ github.ref_name }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go run ./tools/repoctl check
      - run: go test -race ./...
      - run: go run ./tools/repoctl release-build --tag-env --out dist/candidate
      - run: go run ./tools/repoctl release-check --tag-env --dir dist/candidate
      - run: go run ./tools/repoctl release-repeat --tag-env --dir dist/candidate
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/candidate/*
          if-no-files-found: error
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist/candidate
      - run: go run ./tools/repoctl release-smoke --tag-env --dir dist/candidate
  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: candidate/*
